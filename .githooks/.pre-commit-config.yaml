# do pre-commit install --config .githooks/.pre-commit-config.yaml
# once
repos:
  - repo: local
    hooks:
      - id: clang-format
        name: clang-format
        entry: clang-format -i
        language: system
        types_or: [c, c++]
      - id: prettier-markdown
        name: prettier (Markdown)
        entry: prettier --write
        language: node
        language_version: system
        additional_dependencies: [prettier@3.6.2]
        types: [markdown]